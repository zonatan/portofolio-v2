<g filter="url(#shadow)"><path d="M84 90H1050V796L1036 810H70V104Z" fill="#0b0915" stroke="#3a2f66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="71" y="91" width="978" height="44" rx="0" fill="#18152a"/><path d="M70 135H1050" fill="none" stroke="#2a2445" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="113" r="6" fill="#ff3d9a" opacity="0.85"/><circle cx="116" cy="113" r="6" fill="#a78bfa" opacity="0.7"/><circle cx="136" cy="113" r="6" fill="#c6ff3d" opacity="0.8"/><text x="162" y="118" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#a9a3c4" letter-spacing="2">root@paaz-vps: ~</text><text x="100" y="180" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="400" fill="#847ea0"># hardening server</text><text x="100" y="214" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="214" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">adduser deploy &amp;&amp; usermod -aG sudo deploy</text><text x="100" y="248" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="248" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">sed -i 's/PermitRootLogin yes/no/' sshd_config</text><text x="100" y="282" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="282" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">ufw allow OpenSSH &amp;&amp; ufw allow 'Nginx Full'</text><text x="100" y="316" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="400" fill="#3ddc97">✔ Firewall is active and enabled on system startup</text><text x="100" y="350" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="350" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">apt install nginx mysql-server php8.3-fpm</text><text x="100" y="384" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="384" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">certbot --nginx -d kafepaaz.id</text><text x="100" y="418" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="400" fill="#3ddc97">✔ Congratulations! HTTPS is enabled</text><text x="100" y="452" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="452" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">php artisan optimize &amp;&amp; php artisan migrate --force</text><text x="100" y="486" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="400" fill="#3ddc97">✔ Deployment selesai · 0 downtime</text><text x="100" y="520" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#c6ff3d">$</text><text x="124" y="520" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="19" font-weight="400" fill="#f1eefc">crontab -l | grep backup</text><text x="100" y="554" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="400" fill="#a9a3c4">0 2 * * * /opt/scripts/backup-db.sh</text><g filter="url(#shadow)"><path d="M1124 120H1510V210L1496 224H1110V134Z" fill="#100e1a" stroke="#2a2445" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="1110" y="134" width="4" height="76" rx="0" fill="#c6ff3d"/><text x="1140" y="170" font-family="'Arial Narrow', 'Roboto Condensed', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#f1eefc">NGINX</text><text x="1140" y="200" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#847ea0" letter-spacing="2">REVERSE PROXY · SSL</text><circle cx="1476" cy="172" r="8" fill="#3ddc97"/><g filter="url(#shadow)"><path d="M1124 248H1510V338L1496 352H1110V262Z" fill="#100e1a" stroke="#2a2445" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="1110" y="262" width="4" height="76" rx="0" fill="#a78bfa"/><text x="1140" y="298" font-family="'Arial Narrow', 'Roboto Condensed', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#f1eefc">PHP 8.3-FPM</text><text x="1140" y="328" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#847ea0" letter-spacing="2">LARAVEL APP</text><circle cx="1476" cy="300" r="8" fill="#3ddc97"/><g filter="url(#shadow)"><path d="M1124 376H1510V466L1496 480H1110V390Z" fill="#100e1a" stroke="#2a2445" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="1110" y="390" width="4" height="76" rx="0" fill="#a78bfa"/><text x="1140" y="426" font-family="'Arial Narrow', 'Roboto Condensed', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#f1eefc">MYSQL 8</text><text x="1140" y="456" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="400" fill="#847ea0" letter-spacing="2">DATABASE</text><circle cx="1476" cy="428" r="8" fill="#3ddc97"/><g filter="url(#shadow)"><path d="M1124 504H1510V594L1496 608H1110V518Z" fill="#100e1a" stroke="#2a2445" stroke-width="1.5" stroke-linecap="round" stroke-line